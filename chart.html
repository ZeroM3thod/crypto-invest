<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>BTC/USDT — TradingView Chart</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --tv-bg:          #F2DFCE;
    --tv-panel:       #E8D0BB;
    --tv-border:      #D1BEAE;
    --tv-text:        #43444F;
    --tv-text-dim:    #9598A1;
    --tv-text-bright: #2a2b33;
    --tv-green:       #0D7680;
    --tv-red:         #43444F;
    --tv-accent:      #0D7680;
    --tv-hover:       rgba(13,118,128,.1);
    --tv-toolbar-h:   38px;
    --tv-status-h:    32px;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: var(--tv-bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Trebuchet MS', Roboto, Ubuntu, sans-serif;
    color: var(--tv-text);
    overflow: hidden;
    user-select: none;
  }

  #toolbar {
    display: flex; align-items: center;
    height: var(--tv-toolbar-h);
    background: var(--tv-panel);
    border-bottom: 1px solid var(--tv-border);
    padding: 0 8px; gap: 2px; flex-shrink: 0;
  }
  .tv-divider {
    width: 1px; height: 20px;
    background: var(--tv-border);
    margin: 0 4px; flex-shrink: 0;
  }
  .tb-btn {
    display: flex; align-items: center; gap: 4px;
    height: 28px; padding: 0 7px;
    border-radius: 4px; border: none;
    background: transparent; color: var(--tv-text-dim);
    font-size: 12px; font-weight: 500;
    cursor: pointer; white-space: nowrap;
    transition: background .15s, color .15s;
  }
  .tb-btn:hover  { background: var(--tv-hover); color: var(--tv-text-bright); }
  .tb-btn.active { background: rgba(13,118,128,.15); color: var(--tv-accent); }
  .tb-btn svg    { flex-shrink: 0; }

  #sym-block { display: flex; align-items: center; gap: 6px; padding: 0 6px; }
  #sym-logo {
    width: 22px; height: 22px;
    background: linear-gradient(135deg,#f7931a,#f5a623);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color:#fff; flex-shrink:0;
  }
  #sym-name { font-size:14px; font-weight:600; color:var(--tv-text-bright); cursor:pointer; }
  #sym-name:hover { color:#000; }
  #sym-ex { font-size:10px; color:var(--tv-text-dim); }

  .iv-btn {
    height:26px; padding:0 6px; border-radius:3px; border:none;
    background:transparent; color:var(--tv-text-dim);
    font-size:12px; font-weight:500; cursor:pointer;
    transition: background .15s, color .15s;
  }
  .iv-btn:hover  { background:var(--tv-hover); color:var(--tv-text-bright); }
  .iv-btn.active { background:rgba(13,118,128,.18); color:var(--tv-accent); }

  #statusbar {
    display:flex; align-items:center;
    height:var(--tv-status-h); padding:0 10px; gap:10px;
    font-size:12px; background:var(--tv-panel);
    border-bottom:1px solid var(--tv-border); flex-shrink:0;
  }
  #ohlc-sym { font-weight:600; color:var(--tv-text-bright); font-size:12px; }
  .ohlc-label { color:var(--tv-text-dim); }
  .ohlc-val   { color:var(--tv-text-bright); }
  .ohlc-val.green { color:#0D7680; }
  .ohlc-val.red   { color:#43444F; font-weight:600; }
  #ohlc-change { font-weight:500; }

  #live-badge {
    display:flex; align-items:center; gap:4px;
    background:rgba(13,118,128,.12);
    border:1px solid rgba(13,118,128,.35);
    border-radius:3px; padding:1px 6px;
    font-size:10px; font-weight:600; color:#0D7680;
    margin-left:4px;
  }
  #live-dot {
    width:6px; height:6px; border-radius:50%;
    background:#0D7680;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  #left-bar {
    position:absolute; left:0;
    top:calc(var(--tv-toolbar-h) + var(--tv-status-h));
    bottom:0; width:44px;
    background:var(--tv-panel);
    border-right:1px solid var(--tv-border);
    display:flex; flex-direction:column;
    align-items:center; padding-top:6px; gap:2px;
    z-index:10;
  }
  .draw-btn {
    width:34px; height:34px; border-radius:4px; border:none;
    background:transparent; color:var(--tv-text-dim); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s, color .15s;
  }
  .draw-btn:hover  { background:var(--tv-hover); color:var(--tv-text-bright); }
  .draw-btn.active { background:rgba(13,118,128,.15); color:var(--tv-accent); }
  .draw-sep { width:20px; height:1px; background:var(--tv-border); margin:4px 0; }

  #chart-area {
    position:absolute; left:44px;
    top:calc(var(--tv-toolbar-h) + var(--tv-status-h));
    right:0; bottom:0;
    background:var(--tv-bg); overflow:hidden;
  }
  #tv-chart { width:100%; height:100%; }

  #legend {
    position:absolute; top:6px; left:8px;
    font-size:11px; color:var(--tv-text-dim);
    pointer-events:none; z-index:15;
    display:flex; flex-direction:column; gap:2px;
  }
  #legend-sym { font-size:13px; font-weight:600; color:var(--tv-text-bright); }

  #watermark {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    font-size:56px; font-weight:700;
    color:rgba(67,68,79,.06);
    letter-spacing:2px; pointer-events:none;
    white-space:nowrap; user-select:none; z-index:1;
  }

  #vol-label {
    position:absolute; bottom:28px; left:10px;
    font-size:10px; color:var(--tv-text-dim);
    pointer-events:none; z-index:15;
  }
  #ind-labels { display:none; }
</style>
</head>
<body>

<div id="toolbar">
  <div id="sym-block">
    <div id="sym-logo">₿</div>
    <div>
      <div id="sym-name">BTCUSDT <span style="font-size:10px;color:var(--tv-text-dim)">▾</span></div>
      <div id="sym-ex">BINANCE</div>
    </div>
  </div>
  <div class="tv-divider"></div>
  <button class="iv-btn" data-iv="1m">1m</button>
  <button class="iv-btn" data-iv="5m">5m</button>
  <button class="iv-btn" data-iv="15m">15m</button>
  <button class="iv-btn" data-iv="1h">1H</button>
  <button class="iv-btn active" data-iv="4h">4H</button>
  <button class="iv-btn" data-iv="1d">1D</button>
  <button class="iv-btn" data-iv="1w">1W</button>
  <button class="iv-btn" data-iv="1M">1M</button>
  <div class="tv-divider"></div>
  <button class="tb-btn active" id="btn-candle" title="Candlestick">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
      <rect x="2" y="4" width="3" height="6" rx=".5"/>
      <line x1="3.5" y1="2" x2="3.5" y2="4" stroke="currentColor" stroke-width="1.2"/>
      <line x1="3.5" y1="10" x2="3.5" y2="12" stroke="currentColor" stroke-width="1.2"/>
      <rect x="8" y="2" width="3" height="6" rx=".5"/>
      <line x1="9.5" y1="1" x2="9.5" y2="2" stroke="currentColor" stroke-width="1.2"/>
      <line x1="9.5" y1="8" x2="9.5" y2="13" stroke="currentColor" stroke-width="1.2"/>
    </svg>
    Candles
  </button>
  <button class="tb-btn" id="btn-line" title="Line">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
      <polyline points="1,11 5,6 8,8 13,3"/>

  <button class="tb-btn" id="btn-area" title="Area">

      <path d="M1 11 L5 6 L8 8 L13 3 L13 12 L1 12 Z" fill="currentColor" opacity=".3" stroke="none"/>
      <polyline points="1,11 5,6 8,8 13,3"/>
    </svg>
  </button>
  <div class="tv-divider"></div>
  <button class="tb-btn" title="Indicators">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4">
      <circle cx="7" cy="7" r="2.5"/>
      <line x1="7" y1="1" x2="7" y2="3.5"/><line x1="7" y1="10.5" x2="7" y2="13"/>
      <line x1="1" y1="7" x2="3.5" y2="7"/><line x1="10.5" y1="7" x2="13" y2="7"/>
    </svg>
    Indicators
  </button>
  <div style="flex:1"></div>
  <button class="tb-btn" title="Screenshot">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3">
      <rect x="1" y="3" width="12" height="9" rx="1.5"/>
      <circle cx="7" cy="7.5" r="2.2"/>
      <path d="M5 3 L5.5 1.5 H8.5 L9 3"/>
    </svg>
  </button>
  <button class="tb-btn" title="Settings">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3">
      <circle cx="7" cy="7" r="2"/>
      <path d="M7 1v1.5M7 11.5V13M1 7h1.5M11.5 7H13M2.9 2.9l1.06 1.06M10.04 10.04l1.06 1.06M11.1 2.9L10.04 3.96M3.96 10.04L2.9 11.1" stroke-linecap="round"/>
    </svg>
  </button>
</div>

<div id="statusbar">
  <span id="ohlc-sym">BTCUSDT · 4H</span>
  <div id="live-badge"><div id="live-dot"></div>LIVE</div>
  <span class="ohlc-label">O</span><span class="ohlc-val" id="ohlc-o">—</span>
  <span class="ohlc-label">H</span><span class="ohlc-val green" id="ohlc-h">—</span>
  <span class="ohlc-label">L</span><span class="ohlc-val red" id="ohlc-l">—</span>
  <span class="ohlc-label">C</span><span class="ohlc-val" id="ohlc-c">—</span>
  <span id="ohlc-change" class="ohlc-val">—</span>
  <span class="ohlc-label" style="margin-left:6px">Vol</span>
  <span class="ohlc-val" id="ohlc-v">—</span>

<div id="left-bar">
  <button class="draw-btn active" title="Crosshair">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5">
      <line x1="9" y1="1" x2="9" y2="17"/><line x1="1" y1="9" x2="17" y2="9"/>
    </svg>
  </button>
  <div class="draw-sep"></div>
  <button class="draw-btn" title="Trend Line">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5">
      <line x1="3" y1="15" x2="15" y2="3"/>
      <circle cx="3" cy="15" r="1.5" fill="currentColor"/>

    </svg>
  </button>
  <button class="draw-btn" title="Horizontal Ray">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5">
      <line x1="3" y1="9" x2="15" y2="9"/>

  </button>
  <button class="draw-btn" title="Fibonacci">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.3">
      <line x1="3" y1="4" x2="15" y2="4"/><line x1="3" y1="8" x2="15" y2="8"/>
      <line x1="3" y1="11" x2="15" y2="11"/><line x1="3" y1="14" x2="15" y2="14"/>
      <line x1="3" y1="4" x2="3" y2="14" stroke-width="1.5"/>

  <button class="draw-btn" title="Rectangle">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5">

</div>

<div id="chart-area">
  <div id="watermark">BTCUSDT</div>
  <div id="tv-chart"></div>
  <div id="legend"><span id="legend-sym">BTC/USDT · 4H</span></div>
  <div id="ind-labels"></div>
  <div id="vol-label">Volume</div>
</div>

<script>
function genHistory(count) {
  const phases = [
    { start:52000, end:73000, bars:90 },
    { start:73000, end:56000, bars:60 },
    { start:56000, end:68000, bars:50 },
    { start:68000, end:61000, bars:40 },
    { start:61000, end:67000, bars:29 },
  ];
  const candles = [];
  let price = 52000;
  let ts = Math.floor(new Date('2024-03-01').getTime()/1000);
  const FOUR_H = 4*3600;
  let pi=0, pb=0;
  for (let i=0;i<count;i++) {
    const ph = phases[Math.min(pi,phases.length-1)];
    const trend = (ph.end - ph.start)/ph.bars;
    const vol   = price * 0.012;
    const open  = price;
    const move  = trend + (Math.random()-.42)*vol;
    const close = open + move;
    const wick  = Math.abs(move)*(0.5+Math.random());
    const high  = Math.max(open,close)+Math.random()*wick*0.6;
    const low   = Math.min(open,close)-Math.random()*wick*0.6;
    const volume= 800+Math.random()*3000+Math.abs(move/price)*80000;
    candles.push({
      time: ts,
      open:  +open.toFixed(2), high:  +high.toFixed(2),
      low:   +low.toFixed(2),  close: +close.toFixed(2),
      volume:+volume.toFixed(0)
    });
    price = close; ts += FOUR_H; pb++;
    if (pb >= ph.bars){ pi++; pb=0; }
  }
  return candles;
}

const HISTORY = genHistory(269);
const FOUR_H  = 4*3600;

const chartEl   = document.getElementById('tv-chart');
const chartArea = document.getElementById('chart-area');

const chart = LightweightCharts.createChart(chartEl, {
  width:  chartArea.clientWidth,
  height: chartArea.clientHeight,
  layout: {
    background: { type:'solid', color:'#F2DFCE' },
    textColor:  '#9598A1',
    fontSize: 11,
    fontFamily: "-apple-system,BlinkMacSystemFont,'Trebuchet MS',Roboto,sans-serif",
  },
  grid: {
    vertLines: { color:'#E0CCBB', style:0 },
    horzLines: { color:'#E0CCBB', style:0 },
  },
  crosshair: {
    mode: LightweightCharts.CrosshairMode.Normal,
    vertLine: { color:'#9598A1', width:1, style:3, labelBackgroundColor:'#D1BEAE' },
    horzLine: { color:'#9598A1', width:1, style:3, labelBackgroundColor:'#D1BEAE' },
  },
  rightPriceScale: {
    borderColor: '#D1BEAE',
    textColor:   '#9598A1',
    scaleMargins:{ top:0.08, bottom:0.22 },
  },
  timeScale: {
    borderColor: '#D1BEAE',
    textColor:   '#9598A1',
    timeVisible: true,
    secondsVisible: false,
  },
  handleScroll: { mouseWheel:true, pressedMouseMove:true },
  handleScale:  { mouseWheel:true, pinch:true },
});

// Candles — teal up, charcoal down
const candleSeries = chart.addCandlestickSeries({
  upColor:        '#0D7680',
  downColor:      '#43444F',
  borderUpColor:  '#0D7680',
  borderDownColor:'#43444F',
  wickUpColor:    '#0D7680',
  wickDownColor:  '#43444F',
});
candleSeries.setData(HISTORY);

// Volume
const volumeSeries = chart.addHistogramSeries({
  priceFormat:  { type:'volume' },
  priceScaleId: 'vol',
  scaleMargins: { top:0.82, bottom:0 },
});
volumeSeries.setData(HISTORY.map(c=>({
  time:  c.time,
  value: c.volume,
  color: c.close>=c.open ? 'rgba(13,118,128,0.4)':'rgba(67,68,79,0.35)'
})));
chart.priceScale('vol').applyOptions({
  scaleMargins:{ top:0.82, bottom:0 },
  borderVisible:false,
});

chart.timeScale().fitContent();

// ── LIVE TICKING ──
let lastCandle = { ...HISTORY[HISTORY.length-1] };
let liveCandle = null;
const TICK_MS = 800, TICKS_PER_CANDLE = 80;
let tickCount = 0;
let livePrice = lastCandle.close;
let liveTrend = (Math.random()-0.5)*60;

function nextTick() {
  const volatility = livePrice * 0.0015;
  const change = liveTrend*0.01 + (Math.random()-0.48)*volatility;
  livePrice = Math.max(livePrice+change, 1000);
  if (Math.random()<0.05) liveTrend=(Math.random()-0.5)*120;

  if (!liveCandle) {
    liveCandle = { time:lastCandle.time+FOUR_H, open:livePrice, high:livePrice, low:livePrice, close:livePrice, volume:0 };
  }
  liveCandle.close  = +livePrice.toFixed(2);
  liveCandle.high   = +Math.max(liveCandle.high,livePrice).toFixed(2);
  liveCandle.low    = +Math.min(liveCandle.low,livePrice).toFixed(2);
  liveCandle.volume += 20+Math.random()*80;

  candleSeries.update(liveCandle);
  volumeSeries.update({
    time:liveCandle.time, value:liveCandle.volume,
    color:liveCandle.close>=liveCandle.open?'rgba(13,118,128,0.4)':'rgba(67,68,79,0.35)'
  });
  if (!crosshairTime||crosshairTime===liveCandle.time) displayOHLC(liveCandle);

  tickCount++;
  if (tickCount>=TICKS_PER_CANDLE) {
    lastCandle={...liveCandle}; liveCandle=null; tickCount=0; livePrice=lastCandle.close;
  }
}
setInterval(nextTick, TICK_MS);

// ── OHLC BAR ──
const ohlcO=document.getElementById('ohlc-o'), ohlcH=document.getElementById('ohlc-h'),
      ohlcL=document.getElementById('ohlc-l'), ohlcC=document.getElementById('ohlc-c'),
      ohlcChg=document.getElementById('ohlc-change'), ohlcV=document.getElementById('ohlc-v');

function fmt(n)    { return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtVol(n) { return n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':n.toFixed(0); }

function displayOHLC(c) {
  if (!c) return;
  ohlcO.textContent=fmt(c.open); ohlcH.textContent=fmt(c.high);
  ohlcL.textContent=fmt(c.low);  ohlcC.textContent=fmt(c.close);
  const diff=c.close-c.open, pct=(diff/c.open*100).toFixed(2), pos=diff>=0;
  ohlcChg.textContent=`${pos?'+':''}${diff.toFixed(2)} (${pos?'+':''}${pct}%)`;
  ohlcChg.className=`ohlc-val ${pos?'green':'red'}`;
  ohlcV.textContent=fmtVol(c.volume);
}

const candleMap=new Map(HISTORY.map(c=>[c.time,c]));
let crosshairTime=null;
displayOHLC(HISTORY[HISTORY.length-1]);

chart.subscribeCrosshairMove(param=>{
  if (!param||!param.time){ crosshairTime=null; displayOHLC(liveCandle||lastCandle); return; }
  crosshairTime=param.time;
  if (liveCandle&&param.time===liveCandle.time) displayOHLC(liveCandle);
  else { const c=candleMap.get(param.time); if(c) displayOHLC(c); }
});

// ── CHART TYPE ──
let lineSeries=null, areaSeries=null;
function setChartType(type){
  ['btn-candle','btn-line','btn-area'].forEach(id=>document.getElementById(id).classList.toggle('active',id===`btn-${type}`));
  if(type==='candle'){
    candleSeries.applyOptions({visible:true});
    if(lineSeries) lineSeries.applyOptions({visible:false});
    if(areaSeries) areaSeries.applyOptions({visible:false});
  } else if(type==='line'){
    candleSeries.applyOptions({visible:false});
    if(areaSeries) areaSeries.applyOptions({visible:false});
    if(!lineSeries){ lineSeries=chart.addLineSeries({color:'#0D7680',lineWidth:2,priceLineVisible:false,lastValueVisible:false}); lineSeries.setData(HISTORY.map(c=>({time:c.time,value:c.close}))); }
    else lineSeries.applyOptions({visible:true});
  } else if(type==='area'){
    candleSeries.applyOptions({visible:false});
    if(lineSeries) lineSeries.applyOptions({visible:false});
    if(!areaSeries){ areaSeries=chart.addAreaSeries({topColor:'rgba(13,118,128,.3)',bottomColor:'rgba(13,118,128,0)',lineColor:'#0D7680',lineWidth:2,priceLineVisible:false,lastValueVisible:false}); areaSeries.setData(HISTORY.map(c=>({time:c.time,value:c.close}))); }
    else areaSeries.applyOptions({visible:true});
  }
}
document.getElementById('btn-candle').addEventListener('click',()=>setChartType('candle'));
document.getElementById('btn-line').addEventListener('click',()=>setChartType('line'));
document.getElementById('btn-area').addEventListener('click',()=>setChartType('area'));

// ── INTERVAL SWITCHER ──
document.querySelectorAll('.iv-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.iv-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const iv=btn.dataset.iv;
    document.getElementById('ohlc-sym').textContent=`BTCUSDT · ${iv}`;
    document.getElementById('legend-sym').textContent=`BTC/USDT · ${iv}`;
  });
});

// ── DRAWING TOOLBAR ──
document.querySelectorAll('.draw-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.draw-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// ── RESIZE ──
new ResizeObserver(()=>{
  chart.applyOptions({width:chartArea.clientWidth,height:chartArea.clientHeight});
}).observe(chartArea);
</script>
</body>
</html>
